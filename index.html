<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProCollect | Collection Date Analyzer</title>
    <link rel="icon" type="image/png" href="https://img.icons8.com/?size=80&id=UpnwZDa50fGv&format=png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
        }

        .app-container {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
        }

        .input-field {
            font-size: 14px;
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            width: 100%;
            transition: all 0.15s ease;
            background-color: white;
        }

        .date-input {
            font-size: 13px !important; 
            padding: 8px 4px !important;
            text-align: center;
        }

        .input-field:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .label-text {
            font-size: 12px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 4px;
            display: block;
        }

        /* Minimal Buttons - Color only on hover/active */
        .btn-base {
            border: 1px solid #d1d5db;
            font-size: 13px;
            font-weight: 500;
            padding: 10px 16px;
            border-radius: 8px;
            color: #374151;
            transition: all 0.2s ease;
            background: transparent;
        }

        .btn-copy:hover {
            background: #1f2937;
            border-color: #1f2937;
            color: white;
        }

        .btn-reset:hover {
            background: #dc2626;
            border-color: #dc2626;
            color: white;
        }

        .result-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 16px;
            margin-top: 16px;
            transition: all 0.3s ease;
        }

        #notification-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2937;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
            pointer-events: none;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">

    <div id="notification-bar">Results copied to clipboard!</div>

    <div class="app-container rounded-xl w-full max-w-lg overflow-hidden">
        <div class="p-6">
            <div class="flex items-center gap-3 mb-6 border-b pb-4">
                <div class="bg-blue-600 p-2 rounded-lg">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-gray-900 leading-tight">Collection Analyzer</h1>
                    <p class="text-xs text-gray-500">Official Period Calculation Utility</p>
                </div>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="label-text">Collection Start Date (DD-MM-YYYY)</label>
                    <div class="flex gap-1">
                        <input type="number" id="dayInput" placeholder="DD" class="input-field date-input" oninput="calculateDates()">
                        <input type="number" id="monthInput" placeholder="MM" class="input-field date-input" oninput="calculateDates()">
                        <input type="number" id="yearInput" placeholder="YYYY" class="input-field date-input" oninput="calculateDates()">
                    </div>
                    <p id="dateError" class="text-[10px] text-red-500 mt-1 h-2"></p>
                </div>

                <div id="resultsUI" class="hidden space-y-4">
                    <div class="result-box bg-blue-50/50 border-blue-100">
                        <div class="space-y-1">
                            <h3 class="text-sm font-bold text-blue-700">5 Years Period</h3>
                            <p class="text-xs font-semibold text-blue-600/70 uppercase">1,800 Days</p>
                            <div class="pt-2 border-t border-blue-100 mt-2">
                                <p class="text-[11px] text-gray-500 font-medium">Covers Upto:</p>
                                <p id="cover5Years" class="text-lg font-bold text-blue-900">--</p>
                            </div>
                        </div>
                    </div>

                    <div class="result-box bg-green-50/50 border-green-100">
                        <div class="space-y-1">
                            <h3 class="text-sm font-bold text-green-700">3 Years Period</h3>
                            <p class="text-xs font-semibold text-green-600/70 uppercase">1,080 Days</p>
                            <div class="pt-2 border-t border-green-100 mt-2">
                                <p class="text-[11px] text-gray-500 font-medium">Covers Upto:</p>
                                <p id="cover3Years" class="text-lg font-bold text-green-900">--</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex gap-2 pt-2">
                    <button id="copyButton" onclick="copyResults()" class="btn-base btn-copy flex-1 disabled:opacity-30" disabled>Copy Results</button>
                    <button onclick="clearAll()" class="btn-base btn-reset flex-1">Reset</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function isValidDate(d, m, y) {
            const date = new Date(y, m - 1, d);
            return date.getFullYear() === y && date.getMonth() === m - 1 && date.getDate() === d;
        }

        function formatDisplayDate(date) {
            const dd = String(date.getDate()).padStart(2, '0');
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const yyyy = date.getFullYear();
            return `${dd}-${mm}-${yyyy}`;
        }

        function calculateDates() {
            const d = parseInt(document.getElementById('dayInput').value);
            const m = parseInt(document.getElementById('monthInput').value);
            const y = parseInt(document.getElementById('yearInput').value);
            const errorEl = document.getElementById('dateError');
            const resultsUI = document.getElementById('resultsUI');
            const copyBtn = document.getElementById('copyButton');

            if (isNaN(d) || isNaN(m) || isNaN(y)) {
                resultsUI.classList.add('hidden');
                copyBtn.disabled = true;
                return;
            }

            if (!isValidDate(d, m, y)) {
                errorEl.textContent = "Invalid date entered.";
                resultsUI.classList.add('hidden');
                copyBtn.disabled = true;
                return;
            }

            errorEl.textContent = "";
            resultsUI.classList.remove('hidden');
            copyBtn.disabled = false;

            const inputDate = new Date(y, m - 1, d);

            // 5 Years Calculation
            const end5 = new Date(inputDate);
            end5.setFullYear(inputDate.getFullYear() + 5);
            end5.setDate(end5.getDate() - 1);
            document.getElementById('cover5Years').textContent = formatDisplayDate(end5);

            // 3 Years Calculation
            const end3 = new Date(inputDate);
            end3.setFullYear(inputDate.getFullYear() + 3);
            end3.setDate(end3.getDate() - 1);
            document.getElementById('cover3Years').textContent = formatDisplayDate(end3);
        }

        function copyResults() {
            const d = document.getElementById('dayInput').value.padStart(2, '0');
            const m = document.getElementById('monthInput').value.padStart(2, '0');
            const y = document.getElementById('yearInput').value;
            
            const start = `${d}-${m}-${y}`;
            const cover5 = document.getElementById('cover5Years').textContent;
            const cover3 = document.getElementById('cover3Years').textContent;

            const text = `Collection Start Date:
${start}

5 Years Period
1,800 Days
Covers Upto:
${cover5}

3 Years Period
1,080 Days
Covers Upto:
${cover3}`;
            
            navigator.clipboard.writeText(text);
            const bar = document.getElementById('notification-bar');
            bar.style.opacity = '1';
            setTimeout(() => bar.style.opacity = '0', 2000);
        }

        function clearAll() {
            document.getElementById('dayInput').value = '';
            document.getElementById('monthInput').value = '';
            document.getElementById('yearInput').value = '';
            document.getElementById('dateError').textContent = '';
            document.getElementById('resultsUI').classList.add('hidden');
            document.getElementById('copyButton').disabled = true;
        }
    </script>
</body>
</html>
